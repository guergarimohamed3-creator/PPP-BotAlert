# ============================================================
# docker-compose.yml — Orchestration de tous les services
# ============================================================
# EXPLICATION GLOBALE :
#   Ce fichier décrit 5 services qui forment le système complet.
#   Docker Compose les démarre tous avec une seule commande :
#   > docker compose up -d
#
#   Les services communiquent entre eux via le réseau Docker
#   interne "botalert-net". À l'extérieur, on expose seulement
#   les ports nécessaires pour accéder via le navigateur ou
#   des outils comme MQTT Explorer.
# ============================================================
# NOTE : "version" est obsolète dans les nouvelles versions
# de Docker Compose (v2+), on ne le met plus.

# ----- Réseau interne partagé par tous les services -----
networks:
  botalert-net:
    driver: bridge

# ----- Volumes persistants (données survivent aux redémarrages) -----
volumes:
  timescaledb-data:   # Données de la base de données
  grafana-data:       # Dashboards et configuration Grafana sauvegardés
  mosquitto-data:     # Messages MQTT persistants (QoS 1 et 2)
  mosquitto-log:      # Logs du broker MQTT

services:

  # ===========================================================
  # SERVICE 1 : MOSQUITTO — Le broker MQTT
  # ===========================================================
  # RÔLE : C'est le "facteur" du système. Les simulateurs PUBLIENT
  #        des messages, le backend s'y ABONNE (SUBSCRIBE).
  #        Protocol MQTT = léger, idéal pour l'IoT.
  # PORT  : 1883 (MQTT standard), 9001 (WebSocket pour debug navigateur)
  # ===========================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped          # Redémarre automatiquement sauf si arrêt manuel
    ports:
      - "1883:1883"                  # Port MQTT standard
      - "9001:9001"                  # Port WebSocket (utile pour MQTT Explorer)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - botalert-net
    healthcheck:
      # On vérifie que le processus mosquitto tourne dans le conteneur.
      # C'est plus fiable que d'envoyer un message MQTT au démarrage.
      test: ["CMD-SHELL", "cat /proc/1/comm | grep -q mosquitto && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================
  # SERVICE 2 : TIMESCALEDB — La base de données
  # ===========================================================
  # RÔLE : Stocker toutes les mesures (poids, gaz, alertes).
  #        TimescaleDB est une EXTENSION de PostgreSQL optimisée
  #        pour les données horodatées (Time-Series). Elle compresse
  #        automatiquement les vieilles données et accélère les
  #        requêtes sur des plages de temps.
  # PORT  : 5432 (PostgreSQL standard)
  # ===========================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                  # Exposé pour debug avec DBeaver/pgAdmin
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - botalert-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================
  # SERVICE 3 : BACKEND — L'API FastAPI
  # ===========================================================
  # RÔLE : Le cerveau du système. Il :
  #   1. Écoute les messages MQTT (subscriber)
  #   2. Valide et calcule (% gaz restant, jours restants)
  #   3. Stocke dans TimescaleDB
  #   4. Expose une API REST pour Grafana et Haytam
  # depends_on : attend que Mosquitto et TimescaleDB soient prêts
  # ===========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      TARE_KG: ${TARE_KG:-14.0}
      BOTTLE_CAPACITY_KG: ${BOTTLE_CAPACITY_KG:-12.0}
      LOW_GAS_THRESHOLD_PCT: ${LOW_GAS_THRESHOLD_PCT:-15}
      LEAK_PPM_THRESHOLD: ${LEAK_PPM_THRESHOLD:-1000}
    ports:
      - "8000:8000"                  # API accessible sur http://localhost:8000
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - botalert-net

  # ===========================================================
  # SERVICE 4 : GRAFANA — Le tableau de bord
  # ===========================================================
  # RÔLE : Interface visuelle. Se connecte directement à TimescaleDB
  #        pour afficher les graphes, jauges et alertes en temps réel.
  #        Le dossier "provisioning" configure automatiquement la
  #        datasource au démarrage (pas besoin de configurer à la main).
  # ===========================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_secret}
      GF_INSTALL_PLUGINS: ""         # Pas de plugins supplémentaires pour l'instant
    ports:
      - "3000:3000"                  # Dashboard sur http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - botalert-net

  # ===========================================================
  # SERVICE 5 : SIMULATOR — Le générateur de données
  # ===========================================================
  # RÔLE : Simule les capteurs IoT. Publie des messages MQTT
  #        comme si c'étaient de vraies bouteilles de gaz.
  #        NUM_DEVICES contrôle le nombre de "maisons" simulées.
  # ===========================================================
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
      NUM_DEVICES: ${NUM_DEVICES:-1}
      PUBLISH_INTERVAL_SEC: ${PUBLISH_INTERVAL_SEC:-5}
      TARE_KG: ${TARE_KG:-14.0}
      BOTTLE_CAPACITY_KG: ${BOTTLE_CAPACITY_KG:-12.0}
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - botalert-net
