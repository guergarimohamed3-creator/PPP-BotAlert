; ============================================================
; platformio.ini — Configuration PlatformIO pour ESP32
; ============================================================
; EXPLICATION :
;   PlatformIO est un outil de développement pour microcontrôleurs.
;   Ce fichier configure la cible matérielle et les bibliothèques
;   nécessaires pour compiler et flasher le firmware ESP32.
;
; USAGE :
;   - Installer PlatformIO : https://platformio.org/install
;   - Dans VS Code : installer l'extension PlatformIO IDE
;   - Compiler : pio run
;   - Flasher  : pio run --target upload
;   - Monitor  : pio device monitor
;
; SIMULATION WOKWI (sans hardware) :
;   https://wokwi.com → nouveau projet ESP32 → coller le code
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Vitesse du moniteur série (pour debug)
monitor_speed = 115200

; Bibliothèques nécessaires
lib_deps =
    ; Client MQTT léger pour microcontrôleurs
    knolleary/PubSubClient @ ^2.8

    ; Driver pour le capteur de poids HX711
    bogde/HX711 @ ^0.7.5

    ; (optionnel) JSON pour construire le payload
    bblanchon/ArduinoJson @ ^7.1.0

; Options de compilation
build_flags =
    -DCORE_DEBUG_LEVEL=3   ; Logs debug activés
