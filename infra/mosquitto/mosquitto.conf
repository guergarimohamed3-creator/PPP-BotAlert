# ============================================================
# mosquitto.conf — Configuration du broker MQTT
# ============================================================
# EXPLICATION :
#   Mosquitto est le serveur MQTT (le "facteur").
#   Ce fichier lui dit comment se comporter.
# ============================================================

# --- Listener standard MQTT (port 1883) ---
# Tous les appareils IoT se connectent sur ce port
listener 1883

# --- Listener WebSocket (port 9001) ---
# Permet de tester depuis un navigateur web ou MQTT Explorer
listener 9001
protocol websockets

# --- Authentification ---
# Pour le développement : on accepte les connexions sans mot de passe.
# En production, il faudrait un fichier de mots de passe.
allow_anonymous true

# --- Persistance des messages ---
# Si un client est déconnecté temporairement, les messages sont sauvegardés.
persistence true
persistence_location /mosquitto/data/

# --- Logs ---
# Enregistre les connexions et les messages pour le débogage.
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
